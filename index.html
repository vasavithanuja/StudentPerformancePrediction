<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudentPredict - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <div class="logo">
            🎓
        </div>

        <h1>StudentPredict</h1>

        <p class="subtitle">
            Student Performance Prediction System
        </p>

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p class="login-text">
                Login to continue
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <p id="loginError" class="form-error"></p>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">
                    Create Account
                </a>
            </p>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
